id: airflow-config-exposure-custom
info:
  name: Airflow Config Exposure (Custom)
  author: watch-recon
  severity: high
  description: Checks if Airflow config endpoint exposes sensitive configuration
  tags: airflow,config,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/config"
      - "{{BaseURL}}/api/v1/variables"
      - "{{BaseURL}}/api/v1/connections"
      - "{{BaseURL}}/api/v1/pools"
      - "{{BaseURL}}/api/v1/roles"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # Must be the actual JSON API response. Without this, the generic words
      # below ("password", "key") match any HTML login page that happens to
      # contain a password field -- which is what produced every false positive
      # (hosts returning a 200 SPA/login page for these paths, not Airflow).
      - type: word
        part: header
        words:
          - "application/json"
      # Airflow's REST collection endpoints always return a "total_entries"
      # counter; /config returns "sections". These keys do not appear in a
      # normal app's JSON, so they confirm the endpoint is really Airflow and
      # really answered unauthenticated.
      - type: word
        part: body
        words:
          - "total_entries"
          - "\"sections\""
          - "\"connections\""
          - "\"variables\""
        condition: or

    extractors:
      - type: json
        json:
          - '.variables[]?.key'
          - '.connections[]?.conn_id'
