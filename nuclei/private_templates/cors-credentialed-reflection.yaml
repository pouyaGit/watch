id: cors-credentialed-reflection-custom
info:
  name: CORS misconfiguration - arbitrary origin reflected with credentials
  author: watch-recon
  severity: high
  description: >
    The server reflects an ATTACKER-CONTROLLED Origin verbatim in
    Access-Control-Allow-Origin AND returns Access-Control-Allow-Credentials:
    true. That exact combination is the exploitable bug: any attacker web page
    can issue credentialed cross-origin requests and READ the authenticated
    response (session-scoped data, tokens, PII). This is proof by construction,
    not fingerprinting -- the matcher only fires when the server echoes our
    unique canary origin, which cannot happen by accident. Reflection WITHOUT
    credentials, or Allow-Origin: * (browsers block * with credentials), do not
    match, because they are not exploitable.
  reference:
    - https://portswigger.net/web-security/cors
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:N/A:N
    cvss-score: 7.7
  tags: cors,misconfig,auth,idor

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    headers:
      Origin: "https://evil-canary-0x1337.attacker.tld"

    matchers-condition: and
    matchers:
      # 1. our exact attacker origin is reflected back (arbitrary-origin trust)
      - type: word
        part: header
        case-insensitive: true
        words:
          - "access-control-allow-origin: https://evil-canary-0x1337.attacker.tld"
      # 2. and credentials are allowed -> the response is readable cross-origin
      - type: word
        part: header
        case-insensitive: true
        words:
          - "access-control-allow-credentials: true"

    extractors:
      - type: kval
        part: header
        kval:
          - access_control_allow_origin
          - access_control_allow_credentials
