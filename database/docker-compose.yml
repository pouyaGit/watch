services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: pouya
      MONGO_INITDB_ROOT_PASSWORD: YourStrongPassword123
    volumes:
      - watchtower-data:/data/db
    restart: unless-stopped

volumes:
  watchtower-data:
