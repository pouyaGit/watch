{# _system_stats.html — fragment swapped into the dashboard every 5s. #}
<div class="stat-card"><div class="stat-label">CPU</div><div class="stat-value">{{ cpu_label }}</div></div>
<div class="stat-card"><div class="stat-label">RAM</div><div class="stat-value">{{ ram_label }}</div><div class="stat-sub">{{ ram_sub }}</div></div>
<div class="stat-card"><div class="stat-label">Disk</div><div class="stat-value">{{ disk_label }}</div><div class="stat-sub">{{ disk_sub }}</div></div>
<div class="stat-card"><div class="stat-label">Load</div><div class="stat-value">{{ load_label }}</div><div class="stat-sub">1m / 5m / 15m</div></div>
